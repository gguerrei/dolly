name: Release

# A tag v* builds the three binaries with the GUI embedded and the Tauri
# installers with the compiled daemon as their sidecar, then opens a draft
# release carrying them with a SHA256SUMS file. Publishing the draft is the
# maintainer's, and publishing it runs publish.yml, which puts the two npm
# packages out. Every action is pinned to a commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: dolly-linux-x64
          - os: macos-latest
            name: dolly-macos-arm64
          - os: windows-latest
            name: dolly-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build:binary
      - run: mv dist/dolly* ${{ matrix.name }}
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  installers:
    permissions:
      contents: write # tauri-action opens the draft release and uploads the installers
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      # tauri build runs the webview build and the sidecar script first (tauri.conf.json, beforeBuildCommand).
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: dolly ${{ github.ref_name }}
          releaseDraft: true

  release:
    # After the installers too, so the binaries join the draft tauri-action opened instead of a second one.
    needs: [binaries, installers]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: binaries
          merge-multiple: true
      - run: cd binaries && sha256sum dolly-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: binaries/*
