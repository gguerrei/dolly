name: Release

# A tag v* builds the three binaries with the GUI embedded, the Tauri
# installers with the compiled daemon as their sidecar, and the two npm packages,
# then opens a draft release carrying the binaries. Publishing the draft and
# the Homebrew formula stay the maintainer's (docs/RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: dolly-linux-x64
          - os: macos-latest
            name: dolly-macos-arm64
          - os: windows-latest
            name: dolly-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build:binary
      - run: mv dist/dolly* ${{ matrix.name }}
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      # tauri build runs the webview build and the sidecar script first (tauri.conf.json, beforeBuildCommand).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: dolly ${{ github.ref_name }}
          releaseDraft: true

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: binaries/dolly-*

  npm:
    needs: binaries
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build:core
      - run: bun run build:npm
      - name: Publish @dollysheep/core and dollysheep
        run: |
          if [ -z "$NPM_CONFIG_TOKEN" ]; then
            echo "NPM_TOKEN is not set in the repository's secrets; the packages were built but not published."
            exit 0
          fi
          bun publish --cwd packages/core/dist --access public
          bun publish --cwd packages/cli --access public
