[package]
name = "dolly-desktop"
version = "0.1.0"
description = "dolly's native shell: a window around `dolly serve`"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.3" }
# The one native thing the webview cannot do: directory and file pickers.
tauri-plugin-dialog = { version = "2.7.2" }
