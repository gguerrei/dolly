<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 120 432 272" role="img" aria-label="dolly, a two-headed sheep">
  <style>
    .ink { fill: #1c1c1c; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6e6e6; }
    }
  </style>
  <!-- One ink: five scallops over a rounded base, the heads as the ends of the
       body facing outward, the eyes cut out through the mask. -->
  <g transform="translate(0 26)">
    <mask id="eyes">
      <rect width="512" height="512" fill="#fff"/>
      <circle transform="translate(404 304) rotate(14)" cx="26" cy="-8" r="8.5"/>
      <circle transform="translate(108 304) rotate(-14)" cx="-26" cy="-8" r="8.5"/>
    </mask>
    <g class="ink" mask="url(#eyes)">
      <rect x="96" y="226" width="320" height="120" rx="60"/>
      <circle cx="256" cy="198" r="84"/>
      <circle cx="176" cy="226" r="64"/>
      <circle cx="336" cy="226" r="64"/>
      <circle cx="128" cy="262" r="48"/>
      <circle cx="384" cy="262" r="48"/>
      <rect transform="translate(404 304) rotate(14)" x="-60" y="-31" width="120" height="62" rx="31"/>
      <rect transform="translate(108 304) rotate(-14)" x="-60" y="-31" width="120" height="62" rx="31"/>
    </g>
  </g>
</svg>
